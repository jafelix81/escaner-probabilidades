name: Escaner Automatico de Bolsa

on:
  workflow_dispatch:
  schedule:
    - cron: '25 19 * * 1-5'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar codigo
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Herramientas Financieras
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas numpy scipy gspread google-auth

    - name: Ejecutar Algoritmo Cuantitativo
      run: python main.py
